global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  # Scrape API instance 1 (Spring Boot Actuator)
  - job_name: "dopashift-api-1"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-1:8080"]
        labels:
          instance: "api-1"

  # Scrape API instance 2 (Spring Boot Actuator)
  - job_name: "dopashift-api-2"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-2:8081"]
        labels:
          instance: "api-2"

  # Scrape Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Scrape OpenTelemetry Collector metrics
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8888"]


